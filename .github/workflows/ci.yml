name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-skills:
    name: Validate skills
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install uv

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate SKILL.md structure
        run: |
          set -e
          echo "Checking every skill has required files..."
          for d in skills/*/; do
            name="${d%/}"
            name="${name#skills/}"
            errors=""
            if [ ! -f "${d}SKILL.md" ]; then
              errors="${errors}missing-SKILL.md "
            fi
            if [ ! -f "${d}README.md" ]; then
              errors="${errors}missing-README.md "
            fi
            if [ ! -f "${d}_meta.json" ]; then
              errors="${errors}missing-_meta.json "
            fi
            if [ -n "$errors" ]; then
              echo "::error::Skill $name: $errors"
              exit 1
            fi
            echo "  ! $name — OK"
          done

      - name: Verify no secrets
        run: |
          if grep -rE '(api[_-]?key|secret|password|token)\s*[:=]\s*["'\''][A-Za-z0-9]{20,}["'\'']' --include='*.json' --include='*.yml' --include='*.yaml' --include='*.py' --include='*.js' --include='*.ts' --include='*.mjs' skills/ 2>/dev/null; then
            echo "::error::Possible hardcoded secret in a skill. Use env vars or SecretRefs."
            exit 1
          fi

      - name: Test clawhub-publish
        run: |
          cd skills/clawhub-publish
          if [ -f scripts/publish.py ]; then
            python3 scripts/publish.py validate ./ 2>&1 || echo "clawhub-publish self-validate had issues"
          fi

      - name: Test clawhub-publish end-to-end
        run: |
          cd skills/clawhub-publish
          python3 scripts/publish.py validate ../git-arsenal 2>&1
          python3 scripts/publish.py validate ../agent-architect 2>&1
          python3 scripts/publish.py validate ../clawhub-publish 2>&1
          python3 scripts/publish.py validate ../self-improve 2>&1

      - name: Test self-improve Node scripts
        run: |
          cd skills/self-improve
          if [ -f scripts/setup.mjs ]; then
            mkdir -p /tmp/si-ci-test
            node scripts/setup.mjs --config user-config.yaml --dry-run 2>&1 || echo "self-improve setup dry-run had issues"
          fi

  python-templates:
    name: Python template smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip (no python templates in kiro-skills)
        run: echo "kiro-skills is skill-only; templates live in kiro-templates"